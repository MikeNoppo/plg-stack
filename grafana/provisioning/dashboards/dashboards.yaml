apiVersion: 1

providers:
  - name: plg-stack
    type: file
    disableDeletion: true
    # Dashboards live in git; edit in the UI, then export the JSON back here.
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
