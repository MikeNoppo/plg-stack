# Copy to grafana/provisioning/alerting/ and set ALERT_EMAIL_ADDRESSES
# (separated by `;`) plus the GF_SMTP_* variables in .env. Use only one
# example: each one replaces the whole notification policy tree.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: email
        settings:
          addresses: ${ALERT_EMAIL_ADDRESSES}

policies:
  - orgId: 1
    receiver: email
    group_by: [grafana_folder, alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
