# Copy to grafana/provisioning/alerting/ and set ALERT_TELEGRAM_BOT_TOKEN and
# ALERT_TELEGRAM_CHAT_ID in .env. Use only one example: each one replaces the
# whole notification policy tree.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: ${ALERT_TELEGRAM_BOT_TOKEN}
          chatid: ${ALERT_TELEGRAM_CHAT_ID}

policies:
  - orgId: 1
    receiver: telegram
    group_by: [grafana_folder, alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
