[alert.host_not_reporting]
title = "Server tidak mengirim data"
summary = 'Server {{ .Labels.host }} ({{ .Labels.env }}) tidak mengirim data lebih dari {not_reporting_after}'
description = "Server mati, jaringan putus, atau agent berhenti. Cek `systemctl status alloy` atau `docker logs plg-agent`."

[alert.disk_high]
title = "Disk hampir penuh"

[alert.disk_critical]
title = "Disk kritis"

[alert.disk_usage]
summary = 'Disk {{ .Labels.mountpoint }} di {{ .Labels.host }} terpakai {{ printf "%.0f" .Values.A.Value }}%'

[alert.disk_fill]
title = "Disk diprediksi penuh dalam {forecast_horizon}"
summary = 'Disk {{ .Labels.mountpoint }} di {{ .Labels.host }} diprediksi penuh dalam {forecast_horizon}'

[alert.memory_high]
title = "RAM hampir habis"
summary = 'RAM {{ .Labels.host }} terpakai {{ printf "%.0f" .Values.A.Value }}%'

[alert.cpu_high]
title = "CPU tinggi"
summary = 'CPU {{ .Labels.host }} {{ printf "%.0f" .Values.A.Value }}% selama {for_cpu_high}'

[alert.container_restarting]
title = "Container sering restart"
summary = 'Service {{ .Labels.service }} di {{ .Labels.host }} restart rata-rata {{ printf "%.1f" .Values.A.Value }}x per replika dalam {restart_window}'

[alert.database_down]
title = "Database tidak bisa diakses"
summary = 'Database {{ .Labels.job }} di {{ .Labels.host }} tidak bisa diakses agent'
description = "Database mati, atau kredensial monitoring di agent salah."
