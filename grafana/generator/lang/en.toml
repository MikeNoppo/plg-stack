# Dashboard and alert text in English. {name} is filled in from config.toml
# (thresholds and durations); {{...}} are Grafana templates and are kept as
# they are.

[units]
s = ["second", "seconds"]
m = ["minute", "minutes"]
h = ["hour", "hours"]
d = ["day", "days"]
w = ["week", "weeks"]

