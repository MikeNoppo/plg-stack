[uptime]
title = "Uptime"
description = "Availability of servers, databases and PLG Stack components within the dashboard time range."
average = "Average availability"
average_desc = "Share of minutes in which a server sent data, counted from its first data in this time range. Orange below {availability_warning}%, red below {availability_critical}%."
servers = "Servers monitored"
total_down = "Total time not reporting"
reboots = "Reboots"
reboots_desc = "Reboots within the time range, seen as server uptime going back to zero."
per_server = "Availability per server"
per_server_desc = "Minutes without data from a server. Short network outages do not count, because agents resend their data once reconnected; what remains means the server or its agent was down. Worst first."
timeline = "Reporting status"
timeline_desc = "Red means at least one minute in that bar had no data from the server. Narrow the time range to see the exact minutes."
reporting = "Reporting"
not_reporting = "Not reporting"
services = "Databases and stack components"
databases = "Database availability"
databases_desc = "Share of time a database was reachable by its agent, while its server was reporting."
components = "PLG Stack component availability"
components_desc = "Measured by Prometheus every 30 seconds; periods when Prometheus itself was down are not recorded."

[uptime.col]
availability = "Availability"
down = "Not reporting"
reboots = "Reboots"
last_seen = "Last seen"

[alerts]
title = "Alert History"
description = "Alert state changes over time, stored in Loki."
firing_now = "Firing alerts"
pending_now = "Pending"
pending_now_desc = "The alert condition holds, but not yet for the rule's `for` duration."
fired_in_range = "Alerts fired (time range)"
fired_in_range_desc = "Number of state changes to Alerting."
history_failed = "History writes failed"
history_failed_desc = "State changes that could not be written to Loki, so the history in this dashboard is incomplete."
evaluation_failures = "Failed evaluations"
evaluation_failures_desc = "Rules that failed to evaluate, for example because of a query error or an unreachable data source."
fired_per_rule = "Alerts fired per rule"
most_frequent = "Most frequent"
changes = "State changes"
changes_desc = "One line per state change. Click a line to see all of its labels and values."
value = "value"

[alert.host_not_reporting]
title = "Server not reporting"
summary = 'Server {{ .Labels.host }} ({{ .Labels.env }}) has sent no data for more than {not_reporting_after}'
description = "The server is down, its network is cut, or the agent stopped. Check `systemctl status alloy` or `docker logs plg-agent`."

[alert.disk_high]
title = "Disk almost full"

[alert.disk_critical]
title = "Disk critical"

[alert.disk_usage]
summary = 'Disk {{ .Labels.mountpoint }} on {{ .Labels.host }} is {{ printf "%.0f" .Values.A.Value }}% full'

[alert.disk_fill]
title = "Disk predicted full within {forecast_horizon}"
summary = 'Disk {{ .Labels.mountpoint }} on {{ .Labels.host }} is predicted to fill up within {forecast_horizon}'

[alert.memory_high]
title = "RAM almost exhausted"
summary = 'RAM on {{ .Labels.host }} is {{ printf "%.0f" .Values.A.Value }}% used'

[alert.cpu_high]
title = "High CPU"
summary = 'CPU on {{ .Labels.host }} at {{ printf "%.0f" .Values.A.Value }}% for {for_cpu_high}'

[alert.container_restarting]
title = "Container restarting often"
summary = 'Service {{ .Labels.service }} on {{ .Labels.host }} restarted {{ printf "%.1f" .Values.A.Value }}x per replica on average within {restart_window}'

[alert.database_down]
title = "Database unreachable"
summary = 'Database {{ .Labels.job }} on {{ .Labels.host }} is unreachable for its agent'
description = "The database is down, or the agent's monitoring credentials are wrong."
