name: plg-stack

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

services:
  gateway:
    image: caddy:${CADDY_VERSION:-2.11.7-alpine}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-256m}
    cpus: ${GATEWAY_CPUS:-0.5}
    environment:
      GATEWAY_SCHEME: ${GATEWAY_SCHEME:-https}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      INGEST_DOMAIN: ${INGEST_DOMAIN:?set INGEST_DOMAIN}
      AGENT_TOKENS: ${AGENT_TOKENS:-}
      SELF_MONITORING_NAME: ${SELF_MONITORING_NAME:-plg-stack}
      SELF_MONITORING_TOKEN: ${SELF_MONITORING_TOKEN:-}
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9180/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - ./agent:/srv/agent:ro
      - caddy-data:/data
      - caddy-config:/config
    # Dokploy appends dokploy-network when a domain is attached; listing
    # default keeps the gateway able to reach the other services.
    networks:
      - default
    depends_on:
      - grafana
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-1g}
    cpus: ${PROMETHEUS_CPUS:-1}
    environment:
      PROMETHEUS_OOO_WINDOW: ${PROMETHEUS_OOO_WINDOW:-24h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s/__OOO_WINDOW__/$${PROMETHEUS_OOO_WINDOW}/" /etc/prometheus/prometheus.yml.tmpl >/prometheus/prometheus.yml || exit 1
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d} \
          --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB} \
          --web.enable-remote-write-receiver \
          --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # The Loki image is distroless (no shell or wget), so it has no
  # healthcheck; the watchdog checks /ready instead.
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.8}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${LOKI_MEMORY_LIMIT:-1g}
    cpus: ${LOKI_CPUS:-1}
    command:
      - -config.file=/etc/loki/${LOKI_CONFIG:-loki.yaml}
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-14d}
      LOKI_RETENTION_JOURNAL: ${LOKI_RETENTION_JOURNAL:-${LOKI_RETENTION:-14d}}
      LOKI_SHORT_RETENTION: ${LOKI_SHORT_RETENTION:-${LOKI_RETENTION:-14d}}
      LOKI_SHORT_RETENTION_ENVS: ${LOKI_SHORT_RETENTION_ENVS:-development|dev|local.*|test.*}
      LOKI_MAX_LOG_AGE: ${LOKI_MAX_LOG_AGE:-168h}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-8}
      LOKI_INGESTION_BURST_MB: ${LOKI_INGESTION_BURST_MB:-16}
      LOKI_PER_STREAM_RATE_MB: ${LOKI_PER_STREAM_RATE_MB:-3}
      LOKI_PER_STREAM_BURST_MB: ${LOKI_PER_STREAM_BURST_MB:-15}
      LOKI_MAX_LINE_SIZE: ${LOKI_MAX_LINE_SIZE:-256KB}
      LOKI_MAX_QUERY_SERIES: ${LOKI_MAX_QUERY_SERIES:-500}
      LOKI_MAX_ENTRIES_PER_QUERY: ${LOKI_MAX_ENTRIES_PER_QUERY:-5000}
      LOKI_QUERY_TIMEOUT: ${LOKI_QUERY_TIMEOUT:-1m}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:-}
      LOKI_S3_REGION: ${LOKI_S3_REGION:-}
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:-}
      LOKI_S3_ACCESS_KEY_ID: ${LOKI_S3_ACCESS_KEY_ID:-}
      LOKI_S3_SECRET_ACCESS_KEY: ${LOKI_S3_SECRET_ACCESS_KEY:-}
      LOKI_S3_FORCE_PATH_STYLE: ${LOKI_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-1}
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${GRAFANA_DOMAIN}}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GF_PLUGINS_PREINSTALL: ${GRAFANA_PLUGINS:-}
      GF_DATABASE_TYPE: ${GRAFANA_DB_TYPE:-sqlite3}
      GF_DATABASE_HOST: ${GRAFANA_DB_HOST:-}
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME:-grafana}
      GF_DATABASE_USER: ${GRAFANA_DB_USER:-}
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      GF_DATABASE_SSL_MODE: ${GRAFANA_DB_SSL_MODE:-disable}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_ADDRESSES: ${ALERT_EMAIL_ADDRESSES:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  watchdog:
    image: alpine:${ALPINE_VERSION:-3.24}
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    environment:
      WATCHDOG_URL: ${WATCHDOG_URL:-}
      WATCHDOG_FAIL_URL: ${WATCHDOG_FAIL_URL:-}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-60}
    command: ["/bin/sh", "/watchdog.sh"]
    volumes:
      - ./watchdog/watchdog.sh:/watchdog.sh:ro

  # Monitors the server this stack runs on, like any other server, through
  # the public ingest URL. Enabled with COMPOSE_PROFILES=self-monitoring.
  agent:
    image: grafana/alloy:${ALLOY_VERSION:-v1.20.1}
    profiles: [self-monitoring]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${SELF_MONITORING_MEMORY_LIMIT:-512m}
    network_mode: host
    pid: host
    cgroup: host
    privileged: true
    environment:
      MONITORING_URL: ${SELF_MONITORING_URL:-https://${INGEST_DOMAIN}}
      MONITORING_USER: ${SELF_MONITORING_NAME:-plg-stack}
      MONITORING_PASSWORD: ${SELF_MONITORING_TOKEN:-}
      MONITORING_HOST: ${SELF_MONITORING_NAME:-plg-stack}
      MONITORING_ENV: ${SELF_MONITORING_ENV:-production}
      AGENT_OFFLINE_BUFFER: ${PROMETHEUS_OOO_WINDOW:-24h}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/plg
    volumes:
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./agent/modules/base.alloy:/etc/alloy/plg/base.alloy:ro
      - ./agent/modules/docker-logs.alloy:/etc/alloy/plg/docker-logs.alloy:ro
      - ./agent/modules/docker-metrics.alloy:/etc/alloy/plg/docker-metrics.alloy:ro
      - agent-data:/var/lib/alloy/data

networks:
  default: {}

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  grafana-data:
  agent-data:
