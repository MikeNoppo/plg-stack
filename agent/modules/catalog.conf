# Module catalog for install.sh. A new module needs only its <name>.alloy file
# and a block here; install.sh code is needed only for extra automation (hook).
#
#   title, description  shown to the user
#   requires = docker    hidden when Docker is not available
#   modes = docker       only offered in these install modes (default: all)
#   detect               always | docker | manual | hook | process <name regex>
#                        (hook: detect_<hook> in install.sh decides)
#   hook = NAME          optional detect_NAME / setup_NAME functions in install.sh
#   privileged = yes     docker mode: privileged container; native mode: the
#                        agent may read every file and process
#   why_privileged       shown when asking for privileged access
#   var.NAME = flags | prompt | default
#                        flags: plain or secret, optionally ",optional"

[base]
title = Host
description = CPU, RAM, disk, network, dan log sistem (journald). Selalu dipasang.
detect = always

[docker-logs]
title = Log container
description = Log semua container. Per container bisa diatur dengan label plg.logs=false atau plg.service=NAMA.
requires = docker
detect = docker

[docker-metrics]
title = Metrik container
description = CPU, RAM, network, dan I/O per container (cAdvisor). Hanya untuk mode docker.
requires = docker
modes = docker
detect = docker
privileged = yes
why_privileged = cAdvisor membaca statistik kernel (cgroup) untuk semua container.

[docker-apps]
title = Metrik aplikasi di container
description = Mengambil /metrics dari container berlabel plg.scrape=true.
requires = docker
detect = hook
hook = docker_apps

[files]
title = File log aplikasi
description = Log aplikasi yang jalan langsung di mesin (nginx, Apache, PHP-FPM, Laravel, Tomcat, PM2, Supervisor). Lokasi dideteksi otomatis; tambahan di /etc/plg-agent/logs.d/.
detect = hook
hook = files

[app-metrics]
title = Metrik aplikasi native
description = Mengambil /metrics dari aplikasi yang jalan langsung di mesin; target di /etc/plg-agent/metrics.d/.
detect = hook
hook = app_metrics

[process]
title = Metrik per proses
description = CPU, RAM, dan I/O per nama proses (java, node, php-fpm, dan lainnya).
detect = hook
hook = process
privileged = yes
why_privileged = Membaca statistik I/O semua proses di /proc butuh izin setara root.

[postgres]
title = PostgreSQL
description = Koneksi, transaksi, ukuran database, dan log PostgreSQL.
detect = process postgres|postmaster
hook = postgres
var.POSTGRES_DSN = secret | DSN PostgreSQL (postgresql://user:pass@127.0.0.1:5432/postgres?sslmode=disable) |

[mysql]
title = MySQL / MariaDB
description = Koneksi, query, slow query, dan log MySQL/MariaDB.
detect = process mysqld|mariadbd
hook = mysql
var.MYSQL_DSN = secret | DSN MySQL (user:pass@(127.0.0.1:3306)/) |

[redis]
title = Redis
description = Memori, client, command per detik, dan log Redis.
detect = process redis-server
hook = redis
var.REDIS_ADDR = plain | Alamat Redis | 127.0.0.1:6379
var.REDIS_PASSWORD = secret,optional | Password Redis (kosongkan jika tanpa password) |

[mongodb]
title = MongoDB
description = Koneksi, operasi per detik, dan log MongoDB. User butuh role clusterMonitor.
detect = process mongod
var.MONGODB_URI = secret | URI MongoDB (mongodb://user:pass@127.0.0.1:27017/admin) |
